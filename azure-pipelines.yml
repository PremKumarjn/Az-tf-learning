trigger:
- main

parameters:
- name: environment
  displayName: Environment
  type: string
  default: Dev
  values:
    - Dev
    - Prod
  
variables:

- ${{ if eq(parameters.environment, 'Dev') }}:
  - group: AzureResource

- ${{ if eq(parameters.environment, 'Prod') }}:
  - group: AzureResource-Prod

pool:
 vmImage: ubuntu-latest

stages:
- stage: Plan
  displayName: 'Terraform Plan stage'

  jobs:
    - job: TerraformPlan
      displayName: 'Terraform Plan'

      steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: latest

        - template: templates/terraform-init.yml
          parameters:
            environment: ${{ parameters.environment }}
        
        - task: TerraformTask@5
          displayName: 'Terraform Validate'
          inputs:
            provider: azurerm
            command: validate
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/${{parameters.environment}}'

        - task: TerraformTask@5
          displayName: 'Terraform Plan'
          inputs:
            provider: azurerm
            command: plan
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/${{parameters.environment}}'
            commandOptions: '-out=tfplan'
            environmentServiceNameAzureRM: 'Azure-terraform to CICD'



