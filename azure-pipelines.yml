trigger:
- main

parameters:
- name: environment
  displayName: Environment
  type: string
  default: Dev
  values:
    - Dev
    - Prod
  
variables:

- ${{ if eq(parameters.environment, 'Dev') }}:
  - group: AzureResources

- ${{ if eq(parameters.environment, 'Prod') }}:
  - group: AzureResources-Prod

pool:
 vmImage: ubuntu-latest

stages:
- stage: Plan
  displayName: 'Terraform Plan stage'

  jobs:
    - job: TerraformPlan
      displayName: 'Terraform Plan'

      steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: latest

        - template: templates/terraform-init.yml
          parameters:
            environment: ${{ parameters.environment }}
        
        - script: terraform fmt -check -recursive 
          workingDirectory: $(System.DefaultWorkingDirectory)/Environment/${{parameters.environment}}
          displayName: 'Terraform Format check'

        # - task: TerraformTask@5
        #   displayName: 'Terraform Validate'
        #   inputs:
        #     provider: azurerm
        #     command: validate
        #     workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/${{parameters.environment}}'

        - template: templates/terraform-validate.yml
          parameters:
            environment: ${{ parameters.environment }}

        - script: |
            curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
            which tfsec
            tfsec --version
          displayName: 'Install tfsec'

        - script: |
            tfsec .
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/${{parameters.environment }}'
          displayName: 'Terraform Security Scan'

        - script: |
            pip install checkov
          displayName: 'Install Checkov'

        - script: |
            checkov -d .
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/${{parameters.environment }}'
          displayName: 'Checkov scan'
          continueOnError: true

        # - task: TerraformTask@5
        #   displayName: 'Terraform Plan'
        #   inputs:
        #     provider: azurerm
        #     command: plan
        #     workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/${{parameters.environment}}'
        #     commandOptions: '-out=tfplan'
        #     environmentServiceNameAzureRM: 'Azure-terraform to CICD'

        - template: templates/terraform-plan.yml
          parameters:
            environment: ${{ parameters.environment }}

        - script: |
            ls -lrt
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/${{parameters.environment }}'
          displayName: 'Check plan File'


        - task: CopyFiles@2
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)/Environment/${{parameters.environment}}'
            Contents: 'tfplan'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/Environment/${{parameters.environment}}'

        - script: |
            find $(Build.ArtifactStagingDirectory) -type f
          displayName: 'Check Artifact Files'

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/Environment/${{parameters.environment}}'
            ArtifactName: 'tfStatePlan'
            publishLocation: 'Container'

- stage: 
  displayName: 'Terraform Apply Stage'
  dependsOn: Plan

  jobs:
    - deployment: TerraformApply
      displayName: 'Terraform Apply'
      environment: '${{parameters.environment}}'

      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - download: current
                artifact: tfStatePlan

              - script: |
                  echo "pipeline Workspace: $(Pipeline.Workspace)"
                  find $(Pipeline.Workspace) -type f
                displayName: 'Show Downloaded Artifact Files'

              - task: TerraformInstaller@1
                inputs:
                  terraformVersion: 'latest'

              # - script: |
              #     find $(Pipeline.Workspace) -type f
              #     displayName: 'Show Downloaded Files'

              - script: |
                  echo "pipeline Workspace:"
                  echo $(pipeline.Workspace)
                  
                  echo "Downloaded Files:"
                  find $(pipeline.Workspace) -type f
                displayName: 'Show Downloaded files'
                

              - template: templates/terraform-init.yml
                parameters:
                  environment: ${{parameters.environment}}

              - template: templates/terraform-apply.yml
                parameters:
                  environment: ${{ parameters.environment }}



