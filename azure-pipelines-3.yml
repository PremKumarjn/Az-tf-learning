# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

variables:
- group: AzureResources

pool:
  vmImage: ubuntu-latest

stages:

- stage: Plan
  displayName: 'Terraform plan stage'

  jobs:
    - job: Terraformplan
      displayName: 'Terraform plan'

      steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
          
        - script: |
            echo $(ResourceGroupName)
            echo $(StorageAccountName)
            echo $(ContainerName)
            echo $(BackendKey)
          displayName: 'Test Variables'

        - task: TerraformTask@5
          displayName: 'Terraform init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'Azure-terraform to CICD'
            backendAzureRmResourceGroupName: '$(ResourceGroupName)'
            backendAzureRmStorageAccountName: '$(StorageAccountName)'
            backendAzureRmContainerName: '$(ContainerName)'
            backendAzureRmKey: '$(BackendKey)'

        - script: terraform fmt -check -recursive
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
          displayName: 'Terraform Format check'

        - task: TerraformTask@5
          displayName: 'Terraform Validate'
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'

        - script: |
            curl -s 
            https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
            which tfsec
            tfsec --version
          displayName: 'Install tfsec'

        - script: |
            tfsec .
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
          displayName: 'Terraform Security Scan'

        - script: |
            pip install checkov
          displayName: 'Install Checkov'

        - script: |
            checkov -d .
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
          displayName: 'Checkov scan'

        # - script: |
        #     terraform workspace select dev2 || terraform workspace new dev2
        #   workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
        #   displayName: 'Select Workspace'
          
        - task: TerraformTask@5
          displayName: 'Terraform Plan'
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            commandOptions: '-out=tfplan'
            environmentServiceNameAzureRM: 'Azure-terraform to CICD'
        
        - task: CopyFiles@2
          displayName: 'Copy File'
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            Contents: 'tfplan'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/Environment/Dev'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish Build Artifact'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/Environment/Dev'
            ArtifactName: 'tfstateplan'
            publishLocation: 'Container'
          
- stage: Apply 
  displayName: 'Terraform Apply Stage'
  dependsOn: Plan

  jobs:
    - deployment: TerraformApply
      displayName: 'Terraform Apply'
      environment: 'Dev'

      strategy: 
        runOnce:
          deploy:
            
            steps:
              
              - checkout: self
              
              - download: current
                artifact: tfstateplan
              
              - script: |
                  echo "System.DefaultWorkingDirectory"
                  echo $(System.DefaultWorkingDirector)
                  
                  echo "Pipeline Workspace:"
                  echo $(Pipeline.Workspace)

                  find $(Pipeline.Workspace) -type f
                  echo "Current Directory:"
                  pwd
                displayName: 'Show downloaded files'

              - task: TerraformInstaller@1
                displayName: 'Terraform install'
                inputs:
                  terraformVersion: 'latest'

              - task: TerraformTask@5
                displayName: 'Terraform init'
                inputs:
                  provider: 'azurerm'
                  command: 'init'
                  workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
                  backendServiceArm: 'Azure-terraform to CICD'
                  backendAzureRmResourceGroupName: '$(ResourceGroupName)' 
                  backendAzureRmStorageAccountName: '$(StorageAccountName)'
                  backendAzureRmContainerName: '$(ContainerName)'
                  backendAzureRmKey: '$(BackendKey)'
              
              - task: TerraformTask@5
                displayName: 'Terraform Apply'
                inputs:
                  provider: 'azurerm'
                  command: 'apply'
                  workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
                  commandOptions: '-auto-approve $(Pipeline.Workspace)/tfstateplan/tfplan'
                  environmentServiceNameAzureRM: 'Azure-terraform to CICD'

